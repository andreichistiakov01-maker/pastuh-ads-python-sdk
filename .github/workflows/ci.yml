name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: pytest
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Metadata + twine check
        run: |
          twine check dist/*
          python - <<'PY'
          import json, zipfile, glob
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          assert any(n.startswith("pastuh_ads/") for n in names), "package missing"
          assert "pastuh_ads-1.3.0.dist-info/METADATA" in names
          print("wheel contents OK:", len(names), "files")
          PY

      - name: Import smoke test
        run: |
          pip install dist/*.whl
          python -c "import pastuh_ads; print('import OK, version', pastuh_ads.__version__)"
