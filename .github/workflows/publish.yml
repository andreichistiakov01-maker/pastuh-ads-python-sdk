name: Publish to PyPI

# Только ручной запуск (workflow_dispatch) — публикация идёт через
# PyPI Trusted Publishing (OIDC), без API-токенов и паролей.
# Дополнительно: GitHub Environment "pypi" с required reviewers —
# второй ручной gate перед фактической публикацией.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dists
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Test suite must pass before any publish
        run: |
          pip install -e ".[dev]"
          pytest -q

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pastuh-ads
    permissions:
      id-token: write   # OIDC Trusted Publishing — только этому job

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (OIDC trusted publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
